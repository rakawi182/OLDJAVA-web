# MATH CORE
# ============================================================================
class MathCore:
    @staticmethod
    def jd_to_julian_date(jd):
        jd += 0.5; Z=int(jd); F=jd-Z
        if Z<2299161: A=Z
        else: alpha=int((Z-1867216.25)/36524.25); A=Z+1+alpha-int(alpha/4)
        B=A+1524; C=int((B-122.1)/365.25); D=int(365.25*C); E=int((B-D)/30.6001)
        day=B-D-int(30.6001*E)+F; month=E-1 if E<14 else E-13; year=C-4716 if month>2 else C-4715
        if year<=0: year-=1
        return year, month, day
    @staticmethod
    def julian_date_to_jd(year, month, day):
        if month<=2: year-=1; month+=12
        A=int(year/100); B=2-A+int(A/4)
        return int(365.25*(year+4716))+int(30.6001*(month+1))+day+B-1524.5
    @staticmethod
    def ka_to_jd(ka): return ka+ΩConstants.KALI_EPOCH_JD_NOON
    @staticmethod
    def jd_to_ka(jd): return int(round(jd-ΩConstants.KALI_EPOCH_JD_NOON))
    @staticmethod
    def ka_to_julian_date(ka):
        jd=MathCore.ka_to_jd(ka); return MathCore.jd_to_julian_date(jd)
    @staticmethod
    def julian_date_to_ka(year, month, day):
        jd=MathCore.julian_date_to_jd(year, month, day); return MathCore.jd_to_ka(jd)
    @staticmethod
    def ka_for_jan1(year_ce):
        if year_ce>=0:
            return int(ΩConstants.KA_1_JAN_1_BC + (365*year_ce) + ((year_ce+3)//4))
        else:
            y=abs(year_ce); return int(ΩConstants.KA_1_JAN_1_BC - (365*y) - ((y+2)//4))
    @staticmethod
    def calculate_i_from_ka(ka):
        return (ka-ΩConstants.KA_8_FEB_1_BC)%ΩConstants.WUKU_CYCLE
    @staticmethod
    def calculate_s_from_ka(ka):
        return ka%ΩConstants.WUKU_CYCLE
    @staticmethod
    def day_of_year(year, month, day):
        month_days=[31,28,31,30,31,30,31,31,30,31,30,31]
        if (year%4==0 and year%100!=0) or (year%400==0): month_days[1]=29
        return sum(month_days[:month-1])+day

class NormalizationEngine:
    def __init__(self):
        self.const=ΩConstants; self._build_mappings()
    def _build_mappings(self):
        self.mapping={}
        self._add_variant_mappings(self.const.MONTHS_SAKA_VARIANTS)
        self._add_variant_mappings(self.const.SADWARA_VARIANTS)
        self._add_variant_mappings(self.const.PANCAWARA_VARIANTS)
        self._add_variant_mappings(self.const.SAPTAWARA_VARIANTS)
        self._add_variant_mappings(self.const.WUKU_NAMES_VARIANTS)
        extra={"asuji":"Asvini","wesaka":"Vaisakha","besakha":"Vaisakha","jestha":"Jyestha",
               "srawana":"Sravana","badrapada":"Bhadrapada","magha":"Magha","palguna":"Phalguna",
               "pausa":"Pausa","kartika":"Kartika","margasira":"Margasira",
               "wukir":"Wukir","wugu":"Wugu","wayang":"Wayang","kulawu":"Kulawu","dukut":"Dukut",
               "watugunung":"Watugunung","jumat":"Sukra","sukra":"Sukra","sukro":"Sukra",
               "redite":"Aditya","minggu":"Aditya","senen":"Soma","senin":"Soma","selasa":"Anggara",
               "rabu":"Budha","kamis":"Wrhaspati","sabtu":"Saniscara","tumpak":"Saniscara",
               "legi":"Umanis","umanis":"Umanis","pahing":"Pahing","pon":"Pon","wage":"Wage",
               "kliwon":"Kaliwon","kaliwon":"Kaliwon","urukung":"Wurukung","aryang":"Haryang",
               "buda":"Budha","wrespati":"Wrhaspati"}
        for k,v in extra.items(): self.mapping[k]=v
    def _add_variant_mappings(self, var_dict):
        for standard, variants in var_dict.items():
            for variant in variants:
                self.mapping[variant.lower()]=standard
    def normalize(self, text):
        if not text: return ""
        txt=text.lower().strip()
        return self.mapping.get(txt, text.title())
    def normalize_inscription_data(self, data):
        nd=data.copy()
        for f in ['masa','wuku','paksa','nakshatra']:
            if f in nd and nd[f]:
                nd[f]=self.normalize(nd[f])
        if 'wara_string' in nd and nd['wara_string']:
            parts=nd['wara_string'].split('-')
            np=[self.normalize(p) for p in parts]
            if len(np)>=3:
                nd['wara_string']=f"{np[0]}-{np[1]}-{np[2]}"
            elif len(np)==2 and np[0] in ["Sukra","Jumat"]:
                nd['wara_string']=f"Haryang-{np[1]}-Sukra"
        return nd

class MechanicalEngine:
    def __init__(self):
        self.const=ΩConstants; self.math=MathCore(); self.norm=NormalizationEngine()
        self.SAKA_MONTH_TO_JULIAN_RANGE=self.const.SAKA_MONTH_TO_JULIAN_RANGE
        self._build_wara_wuku_lookup()
    def _build_wara_wuku_lookup(self):
        self.wara_triple_to_index={}
        self.wara_triple_to_wuku={}
        self.wuku_sapta_to_triple={}
        self.wuku_all_triples={}
        for entry in self.const.WARA_WUKU_MATRIX_210["DATA"]:
            idx,wuku_num,wuku_name,sad,panca,sapta=entry
            sad_n=self.norm.normalize(sad); panca_n=self.norm.normalize(panca); sapta_n=self.norm.normalize(sapta); wuku_n=self.norm.normalize(wuku_name)
            triple=(sad_n,panca_n,sapta_n)
            self.wara_triple_to_index[triple]=idx
            self.wara_triple_to_wuku[triple]=wuku_n
            ws=(wuku_n,sapta_n)
            if ws not in self.wuku_sapta_to_triple:
                self.wuku_sapta_to_triple[ws]=triple
            if wuku_n not in self.wuku_all_triples:
                self.wuku_all_triples[wuku_n]=[]
            self.wuku_all_triples[wuku_n].append(triple)
    def parse_wara_string_smart(self, wara_string, wuku_name=None):
        if not wara_string: return None
        parts=wara_string.split('-')
        if len(parts)==3:
            sad=self.norm.normalize(parts[0]); panca=self.norm.normalize(parts[1]); sapta=self.norm.normalize(parts[2])
            triple=(sad,panca,sapta)
            if triple in self.wara_triple_to_index:
                return {"sadwara":sad,"pancawara":panca,"saptawara":sapta,"format":"full","verified":True}
            else: return None
        elif len(parts)==2:
            p1=self.norm.normalize(parts[0]); p2=self.norm.normalize(parts[1])
            for triple in self.wara_triple_to_index.keys():
                if triple[1]==p2 and triple[2]==p1:
                    if wuku_name and self.wara_triple_to_wuku[triple]!=self.norm.normalize(wuku_name):
                        continue
                    return {"sadwara":triple[0],"pancawara":triple[1],"saptawara":triple[2],"format":"sapta_panca"}
            for triple in self.wara_triple_to_index.keys():
                if triple[0]==p1 and triple[1]==p2:
                    if wuku_name and self.wara_triple_to_wuku[triple]!=self.norm.normalize(wuku_name):
                        continue
                    return {"sadwara":triple[0],"pancawara":triple[1],"saptawara":triple[2],"format":"sad_panca"}
            return None
        elif len(parts)==1:
            p=self.norm.normalize(parts[0])
            for triple in self.wara_triple_to_index.keys():
                if triple[2]==p:
                    if wuku_name and self.wara_triple_to_wuku[triple]!=self.norm.normalize(wuku_name):
                        continue
                    return {"sadwara":triple[0],"pancawara":triple[1],"saptawara":triple[2],"format":"single_sapta"}
            for triple in self.wara_triple_to_index.keys():
                if triple[1]==p:
                    if wuku_name and self.wara_triple_to_wuku[triple]!=self.norm.normalize(wuku_name):
                        continue
                    return {"sadwara":triple[0],"pancawara":triple[1],"saptawara":triple[2],"format":"single_panca"}
            for triple in self.wara_triple_to_index.keys():
                if triple[0]==p:
                    if wuku_name and self.wara_triple_to_wuku[triple]!=self.norm.normalize(wuku_name):
                        continue
                    return {"sadwara":triple[0],"pancawara":triple[1],"saptawara":triple[2],"format":"single_sad"}
            return None
        return None
    def get_index_from_wara_triple(self, sad, panca, sapta):
        return self.wara_triple_to_index.get((sad,panca,sapta))
    def calculate_wuku_wara_from_ka(self, ka):
        i=(ka-self.const.KA_8_FEB_1_BC)%self.const.WUKU_CYCLE
        s=ka%self.const.WUKU_CYCLE
        wuku_num=(i//7)+1
        day_in_wuku=(i%7)+1
        wuku_name=self.const.WUKU_NAMES_STANDARD[wuku_num-1] if 1<=wuku_num<=30 else "Unknown"
        sad_idx=i%6; panca_idx=i%5; sapta_idx=i%7
        sad=self.const.SADWARA_STANDARD[sad_idx]
        panca=self.const.PANCAWARA_STANDARD[panca_idx]
        sapta=self.const.SAPTAWARA_STANDARD[sapta_idx]
        return {
            "ka":ka,"s":s,"i":i,"wuku_num":wuku_num,"wuku_name":wuku_name,
            "day_in_wuku":day_in_wuku,"sadwara":sad,"pancawara":panca,"saptawara":sapta,
            "wara_string":f"{sad}-{panca}-{sapta}"
        }
    def find_tu_pa_a_in_year(self, ce_year):
        ka_jan1=self.math.ka_for_jan1(ce_year)
        i_jan1=(ka_jan1-self.const.KA_8_FEB_1_BC)%self.const.WUKU_CYCLE
        offset=(self.const.WUKU_CYCLE-i_jan1)%self.const.WUKU_CYCLE
        ka_tu_pa_a=ka_jan1+offset
        i_verify=(ka_tu_pa_a-self.const.KA_8_FEB_1_BC)%self.const.WUKU_CYCLE
        if i_verify!=0: return []
        year,month,day=self.math.ka_to_julian_date(ka_tu_pa_a)
        if year!=ce_year:
            ka_tu_pa_a-=self.const.WUKU_CYCLE
            year,month,day=self.math.ka_to_julian_date(ka_tu_pa_a)
        candidates=[{
            "ka":ka_tu_pa_a,"s":ka_tu_pa_a%self.const.WUKU_CYCLE,"i":0,
            "date":(year,month,day),
            "wuku_info":self.calculate_wuku_wara_from_ka(ka_tu_pa_a),
            "is_tu_pa_a":True,
            "day_of_year":self.math.day_of_year(year,month,int(day))
        }]
        ka_next=ka_tu_pa_a+self.const.WUKU_CYCLE
        y2,m2,d2=self.math.ka_to_julian_date(ka_next)
        if y2==ce_year:
            i2=(ka_next-self.const.KA_8_FEB_1_BC)%self.const.WUKU_CYCLE
            if i2==0:
                candidates.append({
                    "ka":ka_next,"s":ka_next%self.const.WUKU_CYCLE,"i":0,
                    "date":(y2,m2,d2),
                    "wuku_info":self.calculate_wuku_wara_from_ka(ka_next),
                    "is_tu_pa_a":True,
                    "day_of_year":self.math.day_of_year(y2,m2,int(d2))
                })
        return candidates
    def validate_ce_year_by_basic_rule(self, saka_year, masa, candidate_ce_year):
        masa_n=self.norm.normalize(masa)
        if masa_n in self.SAKA_MONTH_TO_JULIAN_RANGE:
            info=self.SAKA_MONTH_TO_JULIAN_RANGE[masa_n]
            valid_years=info["add_years"]
            valid_ce=[saka_year+dy for dy in valid_years]
            return candidate_ce_year in valid_ce
        return False
    def get_valid_ce_years_by_rule(self, saka_year, masa):
        masa_n=self.norm.normalize(masa)
        if masa_n in self.SAKA_MONTH_TO_JULIAN_RANGE:
            info=self.SAKA_MONTH_TO_JULIAN_RANGE[masa_n]
            return [saka_year+dy for dy in info["add_years"]]
        return [saka_year+78]
    def julian_month_to_saka_month(self, julian_month):
        return self.const.JULIAN_TO_SAKA_MONTH.get(julian_month)

class IntercalationDetectionEngine:
    def __init__(self):
        self.const=ΩConstants; self.norm=NormalizationEngine()
        self.EXPLICIT_INTERCALATIONS={
            822:{"month":"Pausa","julian_date":(901,1,1),"inscription":"Ayam Těas I","certainty":1.0},
            828:{"month":"Sravana","julian_date":(906,8,15),"inscription":"Palěpangan","certainty":1.0},
            977:{"month":"Caitra","julian_date":(1055,4,14),"inscription":"Batwan B","certainty":1.0}
        }
    def get_explicit_intercalation(self, saka_year):
        return self.EXPLICIT_INTERCALATIONS.get(saka_year)
    def detect_intercalation_damais(self, inscribed_masa, calculated_masa, saka_year=None):
        norm_ins=self.norm.normalize(inscribed_masa)
        norm_calc=self.norm.normalize(calculated_masa)
        if saka_year and saka_year in self.EXPLICIT_INTERCALATIONS:
            exp=self.EXPLICIT_INTERCALATIONS[saka_year]
            if norm_ins==self.norm.normalize(exp["month"]):
                return {
                    "detected":True,"type":"explicit_inscription","diff":1,
                    "intercalated_month":norm_calc,"displayed_month":norm_ins,
                    "confidence":"absolute","source":"explicit_inscription",
                    "explicit_data":exp
                }
        try:
            idx_ins=self.const.SAKA_MONTHS_ORDER.index(norm_ins)
            idx_calc=self.const.SAKA_MONTHS_ORDER.index(norm_calc)
            diff=(idx_ins-idx_calc)%12
            if diff==1:
                return {"detected":True,"type":"punaḥ","diff":1,"confidence":"medium","source":"damais_detection"}
            elif diff==0:
                return {"detected":False,"type":"exact_match","diff":0,"confidence":"high"}
            elif diff==11:
                return {"detected":True,"type":"ambiguous","diff":11,"confidence":"low"}
            else:
                return {"detected":False,"type":"mismatch","diff":diff,"confidence":"low"}
        except:
            return {"detected":False,"error":"bulan tidak valid"}

            breakdown={}
            tahun_score, tahun_info = self._tahun_match_score(cand['date'], inscription_data)
            breakdown['tahun_match']={'score':tahun_score,'weight':self.TPDP_COMPONENTS["TAHUN_MATCH"],'weighted_score':tahun_score*self.TPDP_COMPONENTS["TAHUN_MATCH"],'details':tahun_info}
            bulan_score, bulan_info = self._bulan_match_score(cand['date'], inscription_data.get('masa',''), inscription_data.get('saka_year'))
            breakdown['bulan_match']={'score':bulan_score,'weight':self.TPDP_COMPONENTS["BULAN_MATCH"],'weighted_score':bulan_score*self.TPDP_COMPONENTS["BULAN_MATCH"],'details':bulan_info}
            wara_score, wara_details = self._wara_match_score(cand['wuku_info'], inscription_data)
            breakdown['wara_match']={'score':wara_score,'weight':self.TPDP_COMPONENTS["WARA_MATCH"],'weighted_score':wara_score*self.TPDP_COMPONENTS["WARA_MATCH"],'details':wara_details}
            wuku_score, wuku_details = self._wuku_match_score(cand['wuku_info'], inscription_data)
            breakdown['wuku_match']={'score':wuku_score,'weight':self.TPDP_COMPONENTS["WUKU_MATCH"],'weighted_score':wuku_score*self.TPDP_COMPONENTS["WUKU_MATCH"],'details':wuku_details}
            breakdown['pancanga_plausibility']={'score':0.5,'weight':self.TPDP_COMPONENTS["PANCANGA_PLAUSIBILITY"],'weighted_score':0.5*self.TPDP_COMPONENTS["PANCANGA_PLAUSIBILITY"],'details':{}}
            temporal_score = 1.0 - abs(cand['date'][2]-15)/15.0
            breakdown['temporal_proximity']={'score':temporal_score,'weight':self.TPDP_COMPONENTS["TEMPORAL_PROXIMITY"],'weighted_score':temporal_score*self.TPDP_COMPONENTS["TEMPORAL_PROXIMITY"],'details':{}}
            hist_score=0.0
            if inscription_data.get('saka_year'):
                for anchor in self.const.DAMAIS_ANCHORS:
                    if abs(inscription_data['saka_year']-anchor['saka'])<=5:
                        hist_score=1.0; break
            breakdown['historical_prior']={'score':hist_score,'weight':self.TPDP_COMPONENTS["HISTORICAL_PRIOR"],'weighted_score':hist_score*self.TPDP_COMPONENTS["HISTORICAL_PRIOR"],'details':{}}
            brute_score=1.0 if cand['ka']>0 else 0.0
            breakdown['brute_force_support']={'score':brute_score,'weight':self.TPDP_COMPONENTS["BRUTE_FORCE_SUPPORT"],'weighted_score':brute_score*self.TPDP_COMPONENTS["BRUTE_FORCE_SUPPORT"],'details':{}}
            final_score=sum(info['weighted_score'] for info in breakdown.values())
            confidence = self._get_confidence_level(final_score)
            scored.append({
                'candidate':cand,
                'score':final_score,
                'breakdown':breakdown,
                'intercalation_info':bulan_info if bulan_info.get('detected') else None,
                'confidence':confidence,
                'month_shifted': bulan_info.get('detected', False) if bulan_info else False,
                'has_explicit_intercalation': bulan_info.get('explicit_data') is not None if bulan_info else False,
                'rank':0
            })
        scored.sort(key=lambda x:x['score'], reverse=True)
        for i,c in enumerate(scored): c['rank']=i+1
        return scored
    def _tahun_match_score(self, date, ins):
        y=date[0]; saka=ins.get('saka_year'); masa=ins.get('masa','')
        if not saka or not masa: return 0.0, {}
        valid=self.mech.validate_ce_year_by_basic_rule(saka,masa,y)
        return (1.0 if valid else 0.0), {'valid':valid}
    def _bulan_match_score(self, date, masa, saka):
        month=date[1]; calc_masa=self.mech.julian_month_to_saka_month(month)
        if not calc_masa: return 0.0, {}
        inter=self.intercalation.detect_intercalation_damais(masa, calc_masa, saka)
        if inter.get('detected'):
            return 0.9 if inter.get('type') in ['explicit_inscription','punaḥ'] else 0.5, inter
        if self.norm.normalize(masa)==self.norm.normalize(calc_masa):
            return 1.0, inter
        return 0.1, inter
    def _wara_match_score(self, wuku_info, ins):
        if 'wara_string' not in ins or not ins['wara_string']:
            return 0.5, {'note':'tidak ada data wara'}
        wara=self.mech.parse_wara_string_smart(ins['wara_string'], ins.get('wuku'))
        if not wara:
            return 0.0, {'error':'parse gagal'}
        sad_match = wuku_info.get('sadwara')==wara.get('sadwara')
        panca_match = wuku_info.get('pancawara')==wara.get('pancawara')
        sapta_match = wuku_info.get('saptawara')==wara.get('saptawara')
        match_count=sum([sad_match,panca_match,sapta_match])
        score=1.0 if match_count==3 else (0.4 if match_count==2 else (0.1 if match_count==1 else 0.0))
        return score, {'sad_match':sad_match,'panca_match':panca_match,'sapta_match':sapta_match,'total':match_count}
    def _wuku_match_score(self, wuku_info, ins):
        if 'wuku' not in ins or not ins['wuku']:
            return 0.5, {'note':'tidak ada data wuku'}
        ins_w=self.norm.normalize(ins['wuku'])
        calc_w=self.norm.normalize(wuku_info.get('wuku_name',''))
        return (1.0 if ins_w==calc_w else 0.0), {'match':ins_w==calc_w}
    def _get_confidence_level(self, score):
        if score>=self.THRESHOLDS["HIGH_CONFIDENCE"]: return "TINGGI"
        elif score>=self.THRESHOLDS["MEDIUM_CONFIDENCE"]: return "SEDANG"
        elif score>=self.THRESHOLDS["LOW_CONFIDENCE"]: return "RENDAH"
        else: return "DIREKOMENDASIKAN UNTUK DITOLAK"

class SmartWaraParser:
    def __init__(self, mech):
        self.mech=mech; self.norm=NormalizationEngine(); self.const=ΩConstants
        self.triple_to_index=mech.wara_triple_to_index
        self.triple_to_wuku=mech.wara_triple_to_wuku
        self.wuku_all_triples=mech.wuku_all_triples
        self._build_component_sets()
    def _build_component_sets(self):
        self.sadwara_set=set(self.norm.normalize(s) for s in self.const.SADWARA_STANDARD)
        self.pancawara_set=set(self.norm.normalize(p) for p in self.const.PANCAWARA_STANDARD)
        self.saptawara_set=set(self.norm.normalize(s) for s in self.const.SAPTAWARA_STANDARD)
        self.wuku_set=set(self.norm.normalize(w) for w in self.const.WUKU_NAMES_STANDARD)
    def identify_component_type(self, comp):
        n=self.norm.normalize(comp)
        if n in self.sadwara_set: return "sadwara"
        if n in self.pancawara_set: return "pancawara"
        if n in self.saptawara_set: return "saptawara"
        return "unknown"
    def parse_wara_intelligent(self, wara_string, wuku=None):
        if not wara_string: return {"error":"kosong"}
        parts=[p.strip() for p in wara_string.split('-') if p.strip()]
        if len(parts)==3:
            sad=self.norm.normalize(parts[0]); panca=self.norm.normalize(parts[1]); sapta=self.norm.normalize(parts[2])
            triple=(sad,panca,sapta)
            if triple in self.triple_to_index:
                wc=self.triple_to_wuku.get(triple)
                if wuku and self.norm.normalize(wuku)!=wc:
                    return {"error":"wuku tidak cocok","expected":wc}
                return {
                    "type":"full","sadwara":sad,"pancawara":panca,"saptawara":sapta,
                    "wuku":wc,"confidence":1.0,
                    "all_possibilities":[{"sadwara":sad,"pancawara":panca,"saptawara":sapta,"wuku":wc}]
                }
            return {"error":"triple tidak valid"}
        elif len(parts)==2:
            p1=self.norm.normalize(parts[0]); p2=self.norm.normalize(parts[1])
            wuku_n=self.norm.normalize(wuku) if wuku else None
            poss=[]
            for triple in self.triple_to_index.keys():
                sad,panca,sapta=triple
                if (p1==sad and p2==panca) or (p1==panca and p2==sad) or (p1==sapta and p2==panca) or (p1==panca and p2==sapta):
                    if wuku_n and self.triple_to_wuku[triple]!=wuku_n:
                        continue
                    poss.append({"sadwara":sad,"pancawara":panca,"saptawara":sapta,"wuku":self.triple_to_wuku[triple]})
            if poss:
                return {
                    "type":"partial_two","input_format":wara_string,
                    "confidence":0.9 if len(poss)==1 else 0.7,
                    "num_possibilities":len(poss),
                    "all_possibilities":poss[:10]
                }
            return {"error":"tidak ditemukan kombinasi"}
        elif len(parts)==1:
            p=self.norm.normalize(parts[0]); wuku_n=self.norm.normalize(wuku) if wuku else None
            poss=[]
            for triple in self.triple_to_index.keys():
                if p in triple:
                    if wuku_n and self.triple_to_wuku[triple]!=wuku_n:
                        continue
                    poss.append({"sadwara":triple[0],"pancawara":triple[1],"saptawara":triple[2],"wuku":self.triple_to_wuku[triple]})
            if poss:
                return {
                    "type":"single","input_component":wara_string,
                    "confidence":0.8 if len(poss)==1 else 0.6,
                    "num_possibilities":len(poss),
                    "all_possibilities":poss[:15]
                }
            return {"error":"komponen tidak ditemukan"}
        return {"error":"format tidak dikenali"}

class ΩSthapatiSystem:
    def __init__(self, verbose_startup=False):
        self.const=ΩConstants; self.math=MathCore(); self.norm=NormalizationEngine()
        self.mech=MechanicalEngine(); self.intercalation=IntercalationDetectionEngine()
        self.tpdp=TPDPEngine()
        self.smart_parser=SmartWaraParser(self.mech)
    def convert_prasasti(self, prasasti_data, verbose=False):
        nd=self.norm.normalize_inscription_data(prasasti_data)
        saka_year=nd.get('saka_year'); masa=nd.get('masa','')
        if not saka_year: return []
        valid_ce_years=self.mech.get_valid_ce_years_by_rule(saka_year, masa)
        all_candidates=[]
        for ce_year in valid_ce_years:
            for off in [-1,0,1]:
                search_year=ce_year+off
                tupa_list=self.mech.find_tu_pa_a_in_year(search_year)
                for tupa in tupa_list:
                    cands=self._candidates_from_tupa(tupa, nd, ce_year)
                    all_candidates.extend(cands)
        if not all_candidates: return []
        all_candidates=self._filter_candidates(all_candidates, nd)
        scored=self.tpdp.evaluate_candidates(all_candidates, nd)
        final=[]
        for cand in scored:
            br=cand['breakdown']
            ts=br['tahun_match']['score'] if 'tahun_match' in br else 0
            bs=br['bulan_match']['score'] if 'bulan_match' in br else 0
            ws=br['wara_match']['score'] if 'wara_match' in br else 0
            avg=(ts+bs+ws)/3.0 if (ts+bs+ws)>0 else 0
            if cand['score']>=0.5 and avg>=0.6 and ts>=0.9:
                final.append(cand)
        return final
    def _candidates_from_tupa(self, tupa, nd, expected_year):
        wara_string=nd.get('wara_string')
        if not wara_string: return []
        wara=self.mech.parse_wara_string_smart(wara_string, nd.get('wuku'))
        if not wara: return []
        triple=(wara['sadwara'], wara['pancawara'], wara['saptawara'])
        i_target=self.mech.get_index_from_wara_triple(*triple)
        if i_target is None: return []
        ka_candidate=tupa['ka']+i_target
        year,month,day=self.math.ka_to_julian_date(ka_candidate)
        wuku_info=self.mech.calculate_wuku_wara_from_ka(ka_candidate)
        return [{
            'ka':ka_candidate, 'date':(year,month,day),
            'wuku_info':wuku_info, 'tu_pa_a_anchor':tupa,
            'i':wuku_info['i'], 's':wuku_info['s'],
            'year_match':year==expected_year
        }]
    def _filter_candidates(self, candidates, nd):
        masa=nd.get('masa',''); saka=nd.get('saka_year')
        masa_n=self.norm.normalize(masa)
        info=self.mech.SAKA_MONTH_TO_JULIAN_RANGE.get(masa_n, {})
        valid_months=info.get("julian_months", [])
        explicit=None
        if saka: explicit=self.intercalation.get_explicit_intercalation(saka)
        filtered=[]
        for cand in candidates:
            y,cand_month,d=cand['date']
            if not self.mech.validate_ce_year_by_basic_rule(saka,masa,y):
                continue
            month_valid=True
            if explicit and masa_n==self.norm.normalize(explicit["month"]):
                exp_ka=self.math.julian_date_to_ka(explicit["julian_date"][0],
                                                   explicit["julian_date"][1],
                                                   explicit["julian_date"][2])
                if abs(cand['ka']-exp_ka)<=30:
                    cand['priority']="EXPLICIT_INTERCALATION"
                else:
                    month_valid=False
            else:
                if valid_months:
                    dist=min(abs(cand_month-m)%12 for m in valid_months)
                    if dist<=1:
                        cand['priority']="NORMAL"
                        cand['month_distance']=dist
                    else:
                        month_valid=False
            if month_valid:
                filtered.append(cand)
        return filtered
    def convert_prasasti_with_smart_parsing(self, prasasti_data, verbose=False):
        wara_string=prasasti_data.get('wara_string','')
        wuku=prasasti_data.get('wuku','')
        parse_result=self.smart_parser.parse_wara_intelligent(wara_string, wuku)
        if "error" in parse_result:
            return []
        all_results=[]
        if "all_possibilities" in parse_result:
            poss=parse_result["all_possibilities"]
            for poss_item in poss:
                nd=prasasti_data.copy()
                nd['wara_string']=f"{poss_item['sadwara']}-{poss_item['pancawara']}-{poss_item['saptawara']}"
                res=self.convert_prasasti(nd, False)
                for r in res:
                    r['wara_parsing_info']={
                        'original':wara_string,
                        'parsed_triple':poss_item,
                        'parsing_confidence':parse_result.get('confidence',0)
                    }
                    all_results.append(r)
            unique={}
            for r in all_results:
                ka=r['candidate']['ka']
                if ka not in unique:
                    unique[ka]=r
            return sorted(unique.values(), key=lambda x:x['score'], reverse=True)
        else:
            return self.convert_prasasti(prasasti_data, False)

            } else if (monthShifted) {
                statusIcon = '<i class="fas fa-clock text-warning"></i>';
                statusText = 'Pergeseran Bulan';
            }

            let confColor = 'secondary';
            if (confidence === 'TINGGI') confColor = 'success';
            else if (confidence === 'SEDANG') confColor = 'warning';
            else if (confidence === 'RENDAH') confColor = 'danger';

            const comps = [
                { label: 'Tahun', value: breakdown.tahun || 0 },
                { label: 'Bulan', value: breakdown.bulan || 0 },
                { label: 'Wara', value: breakdown.wara || 0 },
                { label: 'Wuku', value: breakdown.wuku || 0 }
            ];

            let html = `
                <div class="${cardClass}">
                    <div class="d-flex justify-content-between align-items-start flex-wrap">
                        <div>
                            <span class="rank-badge">#${rank}</span>
                            <span class="date-display">${dateStr}</span>
                            <span class="ms-2 ka-display">KA ${ka}</span>
                        </div>
                        <div>
                            <span class="status-icon">${statusIcon}</span>
                            <span class="badge bg-${confColor}">${confidence}</span>
                        </div>
                    </div>
                    <div class="mt-2">
                        <span class="wuku-badge"><i class="fas fa-calendar-alt"></i> ${wuku}</span>
                        <span class="wara-badge ms-2"><i class="fas fa-star"></i> ${wara}</span>
                        ${explicitInter ? '<span class="intercalation-badge ms-2"><i class="fas fa-skull-crosswalk"></i> Interkalasi Eksplisit</span>' : ''}
                        ${(!explicitInter && monthShifted) ? '<span class="shift-badge ms-2"><i class="fas fa-clock"></i> Pergeseran Bulan</span>' : ''}
                    </div>
                    <div class="mt-2">
                        <div class="d-flex justify-content-between">
                            <span>Skor TPDP: <strong>${(score * 100).toFixed(1)}%</strong></span>
                            <span class="text-muted small">${statusText}</span>
                        </div>
                        <div class="score-bar">
                            <div class="score-fill" style="width: ${score * 100}%;"></div>
                        </div>
                    </div>
                    <div class="component-grid">
                        ${comps.map(c => `
                            <div class="component-item">
                                <div class="label">${c.label}</div>
                                <div class="value ${c.value >= 0.9 ? 'high' : c.value >= 0.5 ? 'medium' : 'low'}">${(c.value * 100).toFixed(0)}%</div>
                            </div>
                        `).join('')}
                    </div>
                    ${item.parsing_info ? `<div class="mt-2 small text-muted"><i class="fas fa-lightbulb"></i> Parsing: ${item.parsing_info.original} → ${item.parsing_info.parsed_triple.sadwara}-${item.parsing_info.parsed_triple.pancawara}-${item.parsing_info.parsed_triple.saptawara} (conf: ${(item.parsing_info.parsing_confidence*100).toFixed(0)}%)</div>` : ''}
                </div>
            `;
            box.innerHTML += html;
        });

        container.style.display = 'block';
    }

    function showError(msg) {
        const container = document.getElementById('resultContainer');
        const box = document.getElementById('resultOutput');
        box.style.display = 'block';
        box.classList.add('error');
        box.innerHTML = `<div class="alert alert-danger">❌ ${msg}</div>`;
        container.style.display = 'block';
    }

    async function handleConvert(smart = false) {
        const loader = document.getElementById('resultLoader');
        loader.style.display = 'block';
        document.getElementById('resultOutput').style.display = 'none';
        document.getElementById('resultContainer').style.display = 'block';
        try {
            const data = getFormData();
            for (let k in data) if (data[k] === '' || data[k] === undefined) delete data[k];
            const func = smart ? 'convert_smart' : 'convert_standard';
            const result = await callPython(func, data);
            if (result && result.error) {
                showError(result.error);
            } else if (Array.isArray(result) && result.length === 0) {
                showError('Tidak ditemukan kandidat yang valid.');
            } else {
                showResult(result);
            }
        } catch (err) {
            showError(err.message);
        } finally {
            loader.style.display = 'none';
        }
    }

    document.getElementById('formPrasasti').addEventListener('submit', function(e) {
        e.preventDefault();
        handleConvert(false);
    });

    document.getElementById('btnSmartConvert').addEventListener('click', function() {
        handleConvert(true);
    });

    let sampleIndex = 0;
    document.getElementById('btnLoadSample').addEventListener('click', function() {
        if (!engineReady) { alert('Engine belum siap.'); return; }
        (async () => {
            try {
                const samples = await pyodide.runPythonAsync('json.dumps(SAMPLE_INSCRIPTIONS)');
                const list = JSON.parse(samples);
                if (list.length === 0) return;
                if (sampleIndex >= list.length) sampleIndex = 0;
                const sample = list[sampleIndex];
                setFormData(sample);
                sampleIndex++;
            } catch (e) {
                alert('Gagal load sample: ' + e.message);
            }
        })();
    });

    // Auto-load first sample on ready
    document.addEventListener('DOMContentLoaded', function() {
        const checkReady = setInterval(() => {
            if (engineReady) {
                clearInterval(checkReady);
                document.getElementById('btnLoadSample').click();
            }
        }, 500);
    });
</script>
</body>
</html>
